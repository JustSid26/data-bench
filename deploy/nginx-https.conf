# ---- abuse limits, per visitor ip (the site is public) ----------------------
# uploads and training are the expensive calls; only POSTs count toward them
map $request_method $databench_post_ip {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $databench_post_ip  zone=databench_upload:10m rate=6r/m;
limit_req_zone $databench_post_ip  zone=databench_train:10m  rate=12r/m;
limit_req_zone $binary_remote_addr zone=databench_api:10m    rate=30r/s;
limit_req_status 429;

# https for DOMAIN (setup.sh fills in the name). port 80 only answers the
# certificate challenge and redirects everything else, including the bare ip
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://DOMAIN$request_uri;
    }
}

server {
    # the listen-flag form works on nginx 1.24 (ubuntu 24.04); `http2 on;` needs 1.25+
    listen 443 ssl http2 default_server;
    server_name DOMAIN;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:databench_tls:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/databench-site.conf;
}
