server {
    listen 80 default_server;
    server_name _;

    # the api accepts uploads up to 512 MB
    client_max_body_size 520m;
    client_body_timeout 300s;

    # one shared password for the whole site (created by setup.sh)
    auth_basic "DataBench";
    auth_basic_user_file /etc/nginx/databench.htpasswd;

    # this endpoint reads any path on the server's disk -- never expose it publicly
    location = /api/datasets/from-path {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # large files take a while to parse and profile
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
