# ---- abuse limits, per visitor ip (the site is public) ----------------------
# uploads and training are the expensive calls; only POSTs count toward them
map $request_method $databench_post_ip {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $databench_post_ip  zone=databench_upload:10m rate=6r/m;
limit_req_zone $databench_post_ip  zone=databench_train:10m  rate=12r/m;
limit_req_zone $binary_remote_addr zone=databench_api:10m    rate=30r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;

    # the api accepts uploads up to 512 MB
    client_max_body_size 520m;
    client_body_timeout 300s;

    # optional site password: setup.sh writes auth lines here, or leaves it
    # empty for a public site (the default)
    include /etc/nginx/databench-auth.conf;

    # this endpoint reads any path on the server's disk -- never expose it publicly
    location = /api/datasets/from-path {
        return 403;
    }

    # uploading a dataset
    location = /api/datasets {
        limit_req zone=databench_upload burst=4 nodelay;
        include /etc/nginx/snippets/databench-proxy.conf;
    }

    # starting a training job
    location ~ ^/api/datasets/[^/]+/train$ {
        limit_req zone=databench_train burst=6 nodelay;
        include /etc/nginx/snippets/databench-proxy.conf;
    }

    # everything else in the api -- generous, the ui polls jobs every 0.7s
    location /api/ {
        limit_req zone=databench_api burst=60 nodelay;
        include /etc/nginx/snippets/databench-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/databench-proxy.conf;
    }
}
